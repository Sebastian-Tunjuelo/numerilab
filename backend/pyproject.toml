[project]
name = "numerilab-backend"
version = "0.1.0"
description = "Motor numérico paso a paso para NumériLab (LU, Jacobi, Gauss-Seidel/SOR, Newton-Raphson)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "sympy>=1.13.0",
    "numpy>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

